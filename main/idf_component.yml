## IDF Component Manager Manifest
dependencies:
  idf: ">=5.3"
# No USB. The guest's only input is the serial console.
#
# This used to depend on cherry-embedded/cherryusb for a HID keyboard, with a
# copy of the pre-v6 esp_private/usb_phy.h vendored into components/usb to
# satisfy its Espressif glue -- ESP-IDF v6.1-beta1 removed the in-tree USB host
# stack. All of that is gone: the keyboard was hardcoded into the monitor, and
# storage rather than input is where the interesting work is.
